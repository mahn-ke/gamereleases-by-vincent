#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/gamereleases-by-vincent:latest@sha256:45500b12633c186d4c5e0f6d2b626e95cb436b98f0d684941937c46e85fdf56d
    restart: on-failure:5
    ports:
      - "3000:3000"
    environment:
      - RELEASES_COOKIE=${RELEASES_COOKIE}
      - RELEASES_EMAIL=${RELEASES_EMAIL}
      - RELEASES_PASSWORD=${RELEASES_PASSWORD}
      - DATA_DIR=/app/data
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/releases.ics"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  data:
