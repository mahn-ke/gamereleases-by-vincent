#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/gamereleases-by-vincent:latest@sha256:242bf5ce8a2cbb7eb93e7e834057da8ba11d5a122892c048a5c47f288ce08934
    restart: on-failure:5
    ports:
      - "3000:3000"
    environment:
      - RELEASES_COOKIE=${RELEASES_COOKIE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/releases.ics"]
      interval: 30s
      timeout: 10s
      retries: 5
