#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/gamereleases-by-vincent:latest@sha256:dbc70e320a1b27a61f57a60668ac9edc6fb955dbd596933884dff1a0a27f5b0e
    restart: on-failure:5
    ports:
      - "3000:3000"
    environment:
      - RELEASES_COOKIE=${RELEASES_COOKIE}
      - RELEASES_EMAIL=${RELEASES_EMAIL}
      - RELEASES_PASSWORD=${RELEASES_PASSWORD}
      - DATA_DIR=/app/data
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/releases.ics"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  data:
