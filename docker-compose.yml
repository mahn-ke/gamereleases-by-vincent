#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/gamereleases-by-vincent:latest@sha256:f71edec5ad2db107dc963c75d832a038d41ecf42b3e24abb542a1d9d1c9e30a9
    restart: on-failure:5
    ports:
      - "3000:3000"
    environment:
      - RELEASES_COOKIE=${RELEASES_COOKIE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/releases.ics"]
      interval: 30s
      timeout: 10s
      retries: 5
