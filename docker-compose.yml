#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/gamereleases-by-vincent:latest@sha256:71cc50cedb70304ba3ab37a2df497cc130f2618694a72e3ceda1c1f2f2d534d1
    restart: on-failure:5
    ports:
      - "3000:3000"
    environment:
      - RELEASES_COOKIE=${RELEASES_COOKIE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/releases.ics"]
      interval: 30s
      timeout: 10s
      retries: 5
