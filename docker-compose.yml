#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/gamereleases-by-vincent:latest@sha256:29cb4a66f889bb8ae5156993def0144a2d5aa7d3c903d4d948c44164ca27c9a1
    restart: on-failure:5
    ports:
      - "3000:3000"
    environment:
      - RELEASES_COOKIE=${RELEASES_COOKIE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/releases.ics"]
      interval: 30s
      timeout: 10s
      retries: 5
