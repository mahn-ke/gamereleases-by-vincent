#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/gamereleases-by-vincent:latest@sha256:24244d1fb2e801deaa8d386a50cd0df9cefb3f3feff32b98c939fb1f6b4ffce0
    restart: on-failure:5
    ports:
      - "3000:3000"
    environment:
      - RELEASES_COOKIE=${RELEASES_COOKIE}
      - RELEASES_EMAIL=${RELEASES_EMAIL}
      - RELEASES_PASSWORD=${RELEASES_PASSWORD}
      - DATA_DIR=/app/data
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/releases.ics"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  data:
