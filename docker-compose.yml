#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/gamereleases-by-vincent:latest@sha256:b3db8d761e1cf6db9032c0e98b23863edf7dee76b1f759b01b52a0cd1044d0f8
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_BASE_URL=https://gamereleases.by.vincent.mahn.ke
      - DATA_DIR=/app/data
      # SSO client managed by mahn-ke/repos (oauth_clients)
      - OAUTH_URL=${OAUTH_URL}
      - OAUTH_NAME=${OAUTH_NAME}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      # IGDB credentials from a Twitch developer application (https://dev.twitch.tv/console/apps)
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURITY=${SMTP_SECURITY}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  data:
